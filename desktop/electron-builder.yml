# How the app is packed for each system. Run it through the scripts in
# package.json — they build the board UI into resources/server/ first, which is
# the one thing this file expects to already be there.
appId: dev.ai4kanban.app
productName: AI4Kanban
copyright: Copyright © AI4Kanban contributors

directories:
  output: dist
  buildResources: build

# The app itself is a handful of small files. Everything heavy — the board
# server — rides along as a resource below.
#
# out/ is the compiled app, not the source: src/ is TypeScript, and `npm run
# dist:*` runs `tsc` before this file is ever read. Package straight from a
# checkout that hasn't been built and there is nothing here to package — which
# is the loud failure, and the one we want.
files:
  - out/**/*
  - package.json

# The board UI's prebuilt Next server, copied in by scripts/bundle-ui.mjs. It
# lives outside the asar archive because it is a Node program that reads its own
# files from disk, and Node can't read out of an asar (lib/server.js finds it at
# process.resourcesPath/server).
# The board server (resources/server, built by scripts/bundle-ui.mjs) is copied
# in by this hook rather than by `extraResources`. It has to be: electron-builder
# drops any `node_modules` it finds inside an extra resource, assuming it is the
# app's own and belongs in the asar — and the board server's `node_modules` is
# Next's bundle, without which the packaged app ships a server that can't start.
# The board installer (resources/cli, built by scripts/bundle-cli.mjs) rides
# along in the same hook, for the same reason: it is a Node program that reads
# its own skill files off disk.
# The hook runs before code signing, so what it copies is signed with the rest.
afterPack: scripts/after-pack.js

# --- macOS: the one we test, shipped unsigned this release -------------------
# `identity: "-"` is an ad-hoc signature: Gatekeeper still treats the app as
# unidentified and warns on first open, but the signature is valid, which is
# what Apple Silicon needs before it will launch anything at all. Without it an
# arm64 build opens as "damaged" and there is no way past that.
#
# Signing and notarizing for real is #182. It needs an Apple Developer account,
# its "Developer ID Application" certificate in the keychain, and APPLE_ID /
# APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID in the environment. When that is
# in hand, drop `identity` and set `hardenedRuntime: true` and `notarize: true`
# — the entitlements below are already the ones notarizing requires.
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip # what an auto-update would read, and the smaller download
      arch: [arm64, x64]
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  notarize: false

dmg:
  title: AI4Kanban ${version}

# --- Windows and Linux: built and shipped unsigned this release --------------
# Untested and unsigned, so both systems show a warning on first open. The
# download page says so, and says the one step past it.
win:
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Puts the app's own bin folder — which holds akb.cmd — on the user's PATH, and takes it
  # off again on uninstall (#226). Windows has no symlink to hand out the way macOS does.
  include: build/installer.nsh

linux:
  category: Development
  # One file, nothing to install, runs on any modern distro — the closest thing
  # Linux has to "download and open".
  target:
    - target: AppImage
      arch: [x64, arm64]
