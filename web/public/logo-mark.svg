<!-- AI4Kanban — the square mark on its own. Geometry only, so it renders the
     same anywhere. The colours are the site's tokens: #dd4f1e accent,
     #b83a12 accent-deep, #24231f ink, #ffffff paper. The glyph sits in its own
     60x60 box, scaled to 62% of the block and centred, which is exactly what
     components/ui/Logo.tsx does — change one and change the other. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 78 78" width="78" height="78" role="img" aria-label="AI4Kanban">
  <title>AI4Kanban</title>
  <!-- The mark's double offset: the deep ember one step out, the ink two. Both
       are the block's own outline box, so both are 68 square. -->
  <rect x="10" y="10" width="68" height="68" rx="17" fill="#24231f"/>
  <rect x="5" y="5" width="68" height="68" rx="17" fill="#b83a12"/>
  <rect x="2" y="2" width="64" height="64" rx="15" fill="#dd4f1e" stroke="#24231f" stroke-width="4"/>
  <!-- Three board columns, shared top, stepping down as work leaves the board. -->
  <g transform="translate(12.9 12.9) scale(0.703)" fill="#ffffff">
    <rect x="5" y="8" width="12" height="44" rx="3.5"/>
    <rect x="24" y="8" width="12" height="35" rx="3.5"/>
    <rect x="43" y="8" width="12" height="26" rx="3.5"/>
  </g>
</svg>
