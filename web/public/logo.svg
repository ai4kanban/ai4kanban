<!-- AI4Kanban — the horizontal lockup: the square mark, then the name.
     The mark is geometry and renders identically anywhere. The name is live
     text in the site's own system stack, so it picks up whatever the renderer
     has (SF Pro, Segoe UI, Roboto) rather than shipping a font — the same
     substitution the site itself makes. Anywhere that has no fonts at all,
     use logo-mark.svg and set the name in the surrounding layout. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 74" width="320" height="74" role="img" aria-label="AI4Kanban">
  <title>AI4Kanban</title>
  <rect x="6" y="6" width="68" height="68" rx="17" fill="#191c22"/>
  <rect x="2" y="2" width="64" height="64" rx="15" fill="#12509e" stroke="#191c22" stroke-width="4"/>
  <g transform="translate(12.9 12.9) scale(0.703)" fill="#ffffff">
    <rect x="5" y="8" width="12" height="44" rx="3.5"/>
    <rect x="24" y="8" width="12" height="35" rx="3.5"/>
    <rect x="43" y="8" width="12" height="26" rx="3.5"/>
  </g>
  <text x="90" y="50" fill="#191c22" font-size="44" font-weight="700" letter-spacing="-1"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">AI4Kanban</text>
</svg>
